services:
  odoo:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      ADMIN_PASSWD: ${ADMIN_PASSWD:?set ADMIN_PASSWD}
      ODOO_RC: /var/lib/odoo/odoo.conf
    # Odoo 20: admin_passwd hanya dari file config. Config di-generate ulang tiap start, env = sumber kebenaran.
    entrypoint: ["sh", "-c", "cp /etc/odoo/odoo.conf $$ODOO_RC && printf 'admin_passwd = %s\\n' \"$$ADMIN_PASSWD\" >> $$ODOO_RC && exec /entrypoint.sh odoo"]
    # ponytail: port publik tanpa HTTPS, sementara. Hapus begitu ada domain + Let's Encrypt.
    ports:
      - "8069:8069"
    expose:
      - "8069"
      - "8072"
    volumes:
      - odoo-data:/var/lib/odoo

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      retries: 5

volumes:
  odoo-data:
  db-data:
