services:
  odoo:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    command: ["--", "--admin_passwd", "${ADMIN_PASSWD:?set ADMIN_PASSWD}"]
    expose:
      - "8069"
      - "8072"
    volumes:
      - odoo-data:/var/lib/odoo

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      retries: 5

volumes:
  odoo-data:
  db-data:
